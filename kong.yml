_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:9820
    routes:
      - name: auth-signup
        strip_path: false
        paths:
          - /auth/v1/signup
      - name: auth-login
        strip_path: false
        paths:
          - /auth/v1/login
      - name: auth-refresh-token
        strip_path: false
        paths:
          - /auth/v1/refreshToken
      - name: auth-logout
        strip_path: false
        paths:
          - /auth/v1/logout

  - name: user-service
    url: http://user-service:9810
    routes:
      - name: user-create-update
        strip_path: false
        paths:
          - /user/createUpdate
      - name: user-get-user
        strip_path: false
        paths:
          - /user/getUser

  - name: expense-service
    url: http://expense-service:9830
    routes:
      - name: expense-create
        strip_path: false
        paths:
          - /expense/v1/create
      - name: expense-update
        strip_path: false
        paths:
          - /expense/v1/update
      - name: expense-get-by-user
        strip_path: false
        paths:
          - /expense/v1/

  - name: ds-service
    url: http://ds-service:8002
    routes:
      - name: ds-message
        strip_path: false
        paths:
          - /v1/ds/message
