version: "3.9"

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092" # External clients (if needed, though we use 9093 for that usually)
      - "9093:9093" # Host access
    environment:
      # -------- KRaft mode (NO ZooKeeper) --------
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094 # Controller on internal port 9094

      # -------- Listeners --------
      # PLAINTEXT: Internal communication between containers (port 9092)
      # EXTERNAL: External retrieval from host machine (port 9093)
      # CONTROLLER: Internal controller communication (port 9094)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # -------- Single-node dev settings --------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # -------- REQUIRED for KRaft --------
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg

    volumes:
      - kafka_data:/var/lib/kafka/data

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      # MYSQL_DATABASE is handled by init.sql script
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d # Mount init script
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  user-service:
    image: user-service:latest
    container_name: user-service
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "9810:9810"
    environment:
      # Point to "mysql" container, not localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userservice
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      # Point to "kafka" container
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  auth-service:
    image: auth-service:latest
    container_name: auth-service
    depends_on:
      kafka:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "9820:9820"
    environment:
      # Point to "mysql" container, not localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authservice
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpassword
      # Point to "kafka" container
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  kong:
    image: kong:latest
    container_name: kong
    restart: always
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
      - "8001:8001"

volumes:
  kafka_data:
  mysql_data:
