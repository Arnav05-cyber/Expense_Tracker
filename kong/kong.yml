_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service.expense-tracker.local:9820
    routes:
      - name: auth-signup
        strip_path: false
        paths:
          - /auth/v1/signup
      - name: auth-login
        strip_path: false
        paths:
          - /auth/v1/login
      - name: auth-refresh-token
        strip_path: false
        paths:
          - /auth/v1/refreshToken
      - name: auth-logout
        strip_path: false
        paths:
          - /auth/v1/logout
      - name: auth-ping
        strip_path: false
        paths:
          - /ping

  - name: user-service
    url: http://user-service.expense-tracker.local:9810
    plugins:
      - name: external-auth
        config:
          auth_url: http://auth-service.expense-tracker.local:9820/ping
    routes:
      - name: user-create-update
        strip_path: false
        paths:
          - /user/createUpdate
      - name: user-get-user
        strip_path: false
        paths:
          - /user/getUser
      - name: user-get-by-id
        strip_path: false
        paths:
          - /user/

  - name: expense-service
    url: http://expense-service.expense-tracker.local:9830
    plugins:
      - name: external-auth
        config:
          auth_url: http://auth-service.expense-tracker.local:9820/ping
    routes:
      - name: expense-create
        strip_path: false
        paths:
          - /expense/v1/create
      - name: expense-update
        strip_path: false
        paths:
          - /expense/v1/update
      - name: expense-get-by-user
        strip_path: false
        paths:
          - /expense/v1/

  - name: ds-service
    url: http://ds-service.expense-tracker.local:8002
    routes:
      - name: ds-message
        strip_path: false
        paths:
          - /v1/ds/message
